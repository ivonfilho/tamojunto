<ion-header>
  <ion-toolbar>
    <ion-title>Editar Parceiro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content >
  <ion-item style="--background: transparent; --highlight-color-focused: transparent; --highlight-color: transparent; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">
    <ion-label position="floating">Nome</ion-label>
    <ion-input [(ngModel)]="Empresa.nome"></ion-input>
  </ion-item>

  <ion-item style="--background: transparent; --highlight-color-focused: transparent; --highlight-color: transparent; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">
    <ion-label position="floating">CNPJ</ion-label>
    <ion-input [(ngModel)]="Empresa.cnpj"></ion-input>
  </ion-item>

  <ion-item style="--background: transparent; --highlight-color-focused: transparent; --highlight-color: transparent; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">
    <ion-label position="floating">Website</ion-label>
    <ion-input [(ngModel)]="Parceiro.website"></ion-input>
  </ion-item>

  <ion-item style="--background: transparent; --highlight-color-focused: transparent; --highlight-color: transparent; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">
    <ion-label position="floating">Contato</ion-label>
    <ion-input [(ngModel)]="Parceiro.contato"></ion-input>
  </ion-item>

  <ion-item style="--background: transparent; --highlight-color-focused: transparent; --highlight-color: transparent; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">
    <ion-label>Status</ion-label>
    <ion-select [(ngModel)]="Parceiro.status">
      <ion-select-option [value]="true">Ativo</ion-select-option>
      <ion-select-option [value]="false">Inativo</ion-select-option>
    </ion-select>
  </ion-item>

  <ion-button expand="block" (click)="salvarAlteracoes()">Salvar</ion-button>
</ion-content>
