<ion-header>
  <ion-toolbar>
    <ion-title>Resgatar Cupom</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="cupomId; else erro">
    <fieldset *ngIf="!carregando && !sucesso">
      <h2>Confirmar validação do cupom</h2>
      <p>ID do Cupom: {{ gerarCodigoCurto(cupomId) }}</p>
      <ion-button expand="block" color="primary" (click)="abrirModalConfirmacao()">
        Confirmar validação
      </ion-button>
    </fieldset>
    <fieldset *ngIf="carregando">
      <h2>Validando Cupom...</h2>
      <p>ID do Cupom: {{ cupomId }}</p>
    </fieldset>
    <fieldset *ngIf="sucesso">
      <div
        style="
          text-align: center;
          font-family: Arial, sans-serif;
          background-color: #f0f0f0;
          padding: 20px;
        "
      >
        <h1 style="color: #4caf50">Cupom Resgatado com Sucesso!</h1>
        <p>Aproveite!</p>
      </div>
    </fieldset>
  </div>
  <ng-template #erro>
    <h2>Erro</h2>
    <p>O cupom informado não é válido.</p>
  </ng-template>
</ion-content>
