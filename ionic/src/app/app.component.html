<ion-app>
  <!-- Global Header soberano no topo -->
  <app-header *ngIf="usuario" [usuario]="usuario" [isParceiro]="isParceiro"></app-header>

  <!-- Container principal abaixo do header -->
  <div class="app-main-layout" *ngIf="usuario">

    <!-- Split pane apenas para desktop -->
    <ion-split-pane contentId="main-content" *ngIf="isDesktop && usuario" class="split-pane-global">
      <!-- Menu lateral para desktop -->
      <ion-menu contentId="main-content" type="reveal">
        <ion-content>
          <ion-list id="inbox-list">
            <ion-menu-toggle auto-hide="false" *ngFor="let p of appPages; let i = index">
              <ion-item
                class="no-ripple"
                lines="none"
                detail="false"
                (click)="p.url.includes('dashboard') ? goToHome() : navegarPara(p.url)"
                [ngClass]="{ 'selected': rotaAtiva === p.url }">
                <ion-grid>
                  <ion-row class="ion-justify-content-center ion-align-items-center ion-text-center">
                    <ion-col size="12">
                      <ion-icon aria-hidden="true" [src]="p.icon" [ios]="p.icon + '-outline'"
                        [md]="p.icon + '-sharp'"></ion-icon>
                    </ion-col>
                    <ion-col size="12">
                      <ion-label>{{ p.title }}</ion-label>
                    </ion-col>
                  </ion-row>
                </ion-grid>
              </ion-item>
            </ion-menu-toggle>
          </ion-list>
        </ion-content>
      </ion-menu>

      <!-- Conteúdo principal para desktop -->
      <div id="main-content" class="mobile-app-shell">
        <ion-router-outlet class="mobile-router-outlet"></ion-router-outlet>
      </div>
    </ion-split-pane>

    <!-- Menu lateral responsivo para mobile (fora do split pane) -->
    <ion-menu contentId="main-content-mobile" type="overlay" *ngIf="!isDesktop && usuario">
      <ion-content>
        <ion-list id="inbox-list">
          <ion-menu-toggle auto-hide="false" *ngFor="let p of appPages; let i = index">
            <ion-item
              class="no-ripple"
              lines="none"
              detail="false"
              (click)="p.url.includes('dashboard') ? goToHome() : navegarPara(p.url)"
              [ngClass]="{ 'selected': rotaAtiva === p.url }">
              <ion-grid>
                <ion-row class="ion-justify-content-center ion-align-items-center ion-text-center">
                  <ion-col size="12">
                    <ion-icon aria-hidden="true" [src]="p.icon" [ios]="p.icon + '-outline'"
                      [md]="p.icon + '-sharp'"></ion-icon>
                  </ion-col>
                  <ion-col size="12">
                    <ion-label>{{ p.title }}</ion-label>
                  </ion-col>
                </ion-row>
              </ion-grid>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>

    <!-- Layout mobile: sem ion-content aninhado -->
    <div id="main-content-mobile" class="mobile-app-shell" *ngIf="!isDesktop && usuario">
      <ion-router-outlet class="mobile-router-outlet"></ion-router-outlet>
    </div>

  </div> <!-- /app-main-layout -->

  <!-- Layout para desktop/mobile quando não há usuário (página de login) -->
  <div class="mobile-app-shell" *ngIf="!usuario">
    <ion-router-outlet class="mobile-router-outlet"></ion-router-outlet>
  </div>
</ion-app>
