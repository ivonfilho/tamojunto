<ion-header>
    <ion-toolbar class="toolbar-estilo">
      <ion-title>Pagamento</ion-title>
      <ion-buttons slot="end">
        <ion-button (click)="fecharModal()">Fechar</ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-list>
      <ion-item>
        <ion-label position="stacked">Número do Cartão</ion-label>
        <ion-input [(ngModel)]="pagamento.CardNumber"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Mês de Expiração</ion-label>
        <ion-input [(ngModel)]="pagamento.ExpMonth"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Ano de Expiração</ion-label>
        <ion-input [(ngModel)]="pagamento.ExpYear"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Código de Segurança</ion-label>
        <ion-input type="password" [(ngModel)]="pagamento.SecuritCode"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Nome do Titular</ion-label>
        <ion-input [(ngModel)]="pagamento.CardHolderName"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">CPF do Titular</ion-label>
        <ion-input [(ngModel)]="pagamento.CardHolderTaxId"></ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" color="success" (click)="pagar()">Confirmar Pagamento</ion-button>
  </ion-content>
