<ion-content>
  <div class="dashboard-header" style="border-radius: 0 0 24px 24px; margin-bottom: 24px;">
    <div class="header-content">
      <h1>Pagamento</h1>
      <p>Insira os dados do seu cartão</p>
    </div>
    <div class="header-decoration">
      <div class="decoration-circle"></div>
      <div class="decoration-circle"></div>
    </div>
    <ion-button (click)="fecharModal()" fill="clear" style="position: absolute; top: 10px; right: 10px; --color: white;">
      <ion-icon aria-hidden="true" src="../assets/icon/Close.svg" style="filter: brightness(0) invert(1);"></ion-icon>
    </ion-button>
  </div>
    <ion-list>
      <ion-item>
        <ion-label position="stacked">Número do Cartão</ion-label>
        <ion-input autocomplete="on" [(ngModel)]="pagamento.CardNumber"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Mês de Expiração</ion-label>
        <ion-input autocomplete="on" [(ngModel)]="pagamento.ExpMonth"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Ano de Expiração</ion-label>
        <ion-input autocomplete="on" [(ngModel)]="pagamento.ExpYear"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Código de Segurança</ion-label>
        <ion-input autocomplete="on" type="password" [(ngModel)]="pagamento.SecuritCode"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Nome do Titular</ion-label>
        <ion-input autocomplete="on" [(ngModel)]="pagamento.CardHolderName"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">CPF do Titular</ion-label>
        <ion-input autocomplete="on" [(ngModel)]="pagamento.CardHolderTaxId"></ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" color="success" (click)="pagar()">Confirmar Pagamento</ion-button>
  </ion-content>
