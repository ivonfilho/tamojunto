<ion-content class="ion-padding">
  <div class="dashboard-header" style="margin: -16px -16px 16px -16px; border-radius: 0 0 24px 24px;">
    <div class="header-content">
      <h1>Novo Parceiro</h1>
      <p>Preencha os dados do novo parceiro</p>
      <div class="header-breadcrumbs">
        <ion-breadcrumbs>
          <ion-icon slot="separator" name="chevron-forward-outline"></ion-icon>
          <ion-breadcrumb routerLink="/dashboard"><ion-icon src="../../assets/icon/HomeOutline.svg" slot="start" style="margin-right: 4px; filter: brightness(0) invert(1);"></ion-icon> </ion-breadcrumb>
          <ion-breadcrumb class="breadcrumb-active">Cadastrar Parceiro</ion-breadcrumb>
        </ion-breadcrumbs>
      </div>
    </div>
    <div class="header-decoration">
      <div class="decoration-circle"></div>
      <div class="decoration-circle"></div>
    </div>
  </div>
  <!-- Card: Dados do Parceiro -->

    <ion-card-content >
      <ion-item  style="--background: transparent; --highlight-color-focused: transparent; --highlight-color: transparent; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">
        <ion-label position="stacked">Nome do Parceiro</ion-label>
        <ion-input autocomplete="on" [(ngModel)]="Parceiro.nome" style="margin-top: 12px;" placeholder="Digite o nome"></ion-input>
      </ion-item>

      <ion-item style="--background: transparent; --highlight-color-focused: transparent; --highlight-color: transparent; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">
        <ion-label position="stacked">Website</ion-label>
        <ion-input autocomplete="on" [(ngModel)]="Parceiro.website"  style="margin-top: 12px;"placeholder="https://"></ion-input>
      </ion-item>

      <ion-item style="--background: transparent; --highlight-color-focused: transparent; --highlight-color: transparent; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">
        <ion-label position="stacked">Contato</ion-label>
        <ion-input autocomplete="on" [(ngModel)]="Parceiro.contato"  style="margin-top: 12px;" placeholder="(00) 00000-0000"></ion-input>
      </ion-item>

      <ion-item style="--background: transparent; --highlight-color-focused: transparent; --highlight-color: transparent; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">
        <ion-label>Status</ion-label>
        <ion-toggle slot="end" [(ngModel)]="Parceiro.status" color="success"></ion-toggle>
      </ion-item>
    </ion-card-content>


  <!-- Card: Dados da Empresa -->
    <ion-card-content>
      <ion-item style="--background: transparent; --highlight-color-focused: transparent; --highlight-color: transparent; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">
        <ion-label position="stacked">Nome da Empresa</ion-label>
        <ion-input autocomplete="on" [(ngModel)]="Empresa.nome" style="margin-top: 12px;" placeholder="Digite o nome da empresa"></ion-input>
      </ion-item>

      <ion-item style="--background: transparent; --highlight-color-focused: transparent; --highlight-color: transparent; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">
        <ion-label position="stacked">CNPJ</ion-label>
        <ion-input autocomplete="on" [(ngModel)]="Empresa.cnpj"  style="margin-top: 12px;" placeholder="00.000.000/0000-00"></ion-input>
      </ion-item>
    </ion-card-content>

  <!-- Botão de ação -->
  <ion-button expand="block" color="primary" (click)="salvar()">
    <ion-icon name="save-outline" slot="start"></ion-icon>
    Salvar
  </ion-button>
</ion-content>
