<ion-content class="login-page-ion" [scrollY]="true">
  <div class="container">
    <div class="left"></div>
    <div class="right-content">
      <div class="img-container">
        <img src="../../assets/tamo-junto-logo.png" class="logo cursor-pointer" (click)="voltarParaLogin()" />
      </div>

      <div class="form-component">
        <h2 class="titulo-logins">Digite seu email para receber sua nova senha:</h2>
        <div class="form-container premium-form">
          <form [formGroup]="recuperarForm" (ngSubmit)="enviarEmail()" class="form-group">
            <!--<p class="form-subtitle">Digite seu email para receber uma nova senha temporária</p>-->

            <div class="input-group">
              <ion-input autocomplete="on" label="E-mail" labelPlacement="stacked" formControlName="email"
                fill="outline" placeholder="seu@email.com" type="email" required
                [class.ng-invalid]="recuperarForm.get('email')?.touched && recuperarForm.get('email')?.invalid">
              </ion-input>

              <div *ngIf="recuperarForm.get('email')?.invalid && recuperarForm.get('email')?.touched"
                class="error-messages">
                <small *ngIf="recuperarForm.get('email')?.errors?.['required']" class="text-error">
                  <ion-icon src="assets/icon/AlertCircleOutline.svg"></ion-icon> O email é obrigatório.
                </small>
                <small *ngIf="recuperarForm.get('email')?.errors?.['email']" class="text-error">
                  <ion-icon src="assets/icon/AlertCircleOutline.svg"></ion-icon> Digite um email válido.
                </small>
              </div>
            </div>

            <button class="btn-padrao btn-prosseguir" type="submit" [disabled]="recuperarForm.invalid || loading">
              <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
              <ng-container *ngIf="!loading">Enviar Nova Senha</ng-container>
            </button>

            <p class="mt-15"><a (click)="voltarParaLogin()" class="svg-icon">
                <ion-icon src="assets/icon/LogOutOutline.svg"></ion-icon> Voltar para o Login</a></p>
          </form>
        </div>
      </div>
    </div>
  </div>
</ion-content>
