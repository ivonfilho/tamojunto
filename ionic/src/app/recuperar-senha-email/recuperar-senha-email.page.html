<ion-content class="login-page-ion" [scrollY]="true">
  <div class="container">
    <div class="left"></div>
    <div class="right-content">
      <div class="img-container">
        <img src="../../assets/tamo-junto-logo.png" class="logo cursor-pointer" (click)="voltarParaLogin()" />
      </div>

      <div class="form-component">
        <h2 class="titulo-logins">Recuperar Senha</h2>
        <div class="form-container premium-form">
          <form [formGroup]="recuperarForm" (ngSubmit)="enviarEmail()" class="form-group">
            <p class="form-subtitle">Digite seu email para receber uma nova senha temporária</p>

            <div class="input-group">
              <ion-input
                label="E-mail"
                labelPlacement="stacked"
                formControlName="email"
                fill="outline"
                placeholder="seu@email.com"
                type="email"
                required
                [class.ng-invalid]="recuperarForm.get('email')?.touched && recuperarForm.get('email')?.invalid">
              </ion-input>

              <div *ngIf="recuperarForm.get('email')?.invalid && recuperarForm.get('email')?.touched" class="error-messages">
                <small *ngIf="recuperarForm.get('email')?.errors?.['required']" class="text-error">
                  <ion-icon name="alert-circle-outline"></ion-icon> O email é obrigatório.
                </small>
                <small *ngIf="recuperarForm.get('email')?.errors?.['email']" class="text-error">
                  <ion-icon name="alert-circle-outline"></ion-icon> Digite um email válido.
                </small>
              </div>
            </div>

            <ion-button expand="full" type="submit" [disabled]="recuperarForm.invalid || loading">
              <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
              <ng-container *ngIf="!loading">Enviar Nova Senha</ng-container>
            </ion-button>

            <p><a (click)="voltarParaLogin()" class="cursor-pointer">Voltar para Login</a></p>
          </form>
        </div>
      </div>
    </div>
  </div>
</ion-content>
