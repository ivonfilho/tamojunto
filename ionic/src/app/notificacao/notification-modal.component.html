<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Notificações</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()" fill="clear">
        <ion-icon slot="icon-only" aria-hidden="true" src="../assets/icon/Close.svg" style="filter: brightness(0) invert(1);"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="notifications.length === 0">
    <ion-text color="medium">Você não tem novas notificações.</ion-text>
  </div>

  <div *ngFor="let notification of notifications">
    <ion-item 
    [ngClass]="{ 
      'offer-notification': notification.isOffer, 
      'flash-sale': notification.isFlashSale, 
      'coupon-notification': notification.isCoupon 
    }" 
      (click)="navigateToNotification(notification)" 
      style="--ion-item-background: transparent; --ion-color-primary: inherit; --ion-color-primary-selected-hover: inherit; --ion-color-border: inherit;">
      
      <ion-avatar slot="start">
        <ion-icon [src]="getIconForNotification(notification)" aria-hidden="true"></ion-icon>
      </ion-avatar>
      
      <ion-label>
        <h2>{{ notification.titulo }}</h2>
        <p>{{ notification.subTitulo }}</p>
        <p class="notification-date">{{ notification.dataCriacao | date: 'short' }}</p>
      </ion-label>
    </ion-item>
  </div>
</ion-content>
