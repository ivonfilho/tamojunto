<ion-header>
  <ion-toolbar class="toolbar-estilo">
    <ion-title>Editar Parceiro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content >
  <div style="padding: 16px;">
    <div style="margin-bottom: 16px;">
      <ion-input label="Nome" labelPlacement="stacked" fill="outline" [(ngModel)]="Empresa.nome"></ion-input>
    </div>

    <div style="margin-bottom: 16px;">
      <ion-input label="CNPJ" labelPlacement="stacked" fill="outline" [(ngModel)]="Empresa.cnpj"></ion-input>
    </div>

    <div style="margin-bottom: 16px;">
      <ion-input label="Website" labelPlacement="stacked" fill="outline" [(ngModel)]="Parceiro.website"></ion-input>
    </div>

    <div style="margin-bottom: 16px;">
      <ion-input label="Contato" labelPlacement="stacked" fill="outline" [(ngModel)]="Parceiro.contato"></ion-input>
    </div>

    <div style="margin-bottom: 16px;">
      <ion-select label="Status" labelPlacement="stacked" fill="outline" [(ngModel)]="Parceiro.status">
        <ion-select-option [value]="true">Ativo</ion-select-option>
        <ion-select-option [value]="false">Inativo</ion-select-option>
      </ion-select>
    </div>
  </div>

  <ion-button expand="block" (click)="salvarAlteracoes()">Salvar</ion-button>
</ion-content>
