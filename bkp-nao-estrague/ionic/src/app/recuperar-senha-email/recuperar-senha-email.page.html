<ion-header>
  <ion-toolbar class="toolbar-estilo">
    <ion-title>Recuperar Senha</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="container">
    <div class="logo-container">
      <img src="assets/logo.png" alt="TamoJunto" class="logo">
    </div>

    <div class="form-container">
      <h2>Recuperar Senha por Email</h2>
      <p class="description">Digite seu email cadastrado e enviaremos uma nova senha temporária.</p>

      <form [formGroup]="recuperarForm" (ngSubmit)="enviarEmail()">
        <div style="margin-bottom: 20px;">
          <ion-input
            label="Email"
            labelPlacement="stacked"
            fill="outline"
            type="email"
            formControlName="email"
            placeholder="Digite seu email"
            [class.ion-invalid]="recuperarForm.get('email')?.invalid && recuperarForm.get('email')?.touched">
          </ion-input>
        </div>

        <div class="error-message" *ngIf="recuperarForm.get('email')?.invalid && recuperarForm.get('email')?.touched">
          <span *ngIf="recuperarForm.get('email')?.errors?.['required']">Email é obrigatório</span>
          <span *ngIf="recuperarForm.get('email')?.errors?.['email']">Email inválido</span>
        </div>

        <ion-button
          expand="block"
          type="submit"
          [disabled]="recuperarForm.invalid || loading"
          class="submit-button">
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
          <span *ngIf="!loading">Enviar Nova Senha</span>
        </ion-button>
      </form>

      <div class="alternative-options">
        <p>Ou</p>
        <ion-button
          expand="block"
          fill="outline"
          (click)="irParaRecuperarSms()"
          class="alternative-button">
          Recuperar por Telefone
        </ion-button>
      </div>

      <div class="back-to-login">
        <ion-button
          fill="clear"
          (click)="voltarParaLogin()"
          class="back-button">
          ← Voltar para Login
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
