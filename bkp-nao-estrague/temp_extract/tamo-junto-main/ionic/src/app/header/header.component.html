<ion-header class="ion-no-border">
  <ion-toolbar>
    <div class="header-container">
      <div class="header-content">
        <!-- Botão de menu para mobile (sempre visível) -->
        <ion-button 
          class="menu-button" 
          fill="clear" 
          (click)="toggleMenu()"
          *ngIf="!isDesktop">
          <ion-icon aria-hidden="true" src="../assets/icon/Menu.svg"></ion-icon>
        </ion-button>
        
        <!-- Campo de pesquisa centralizado -->
        <div class="search-container">
          <ion-searchbar 
            placeholder="Buscar..." 
            class="centered-search"
            [(ngModel)]="searchTerm"
            (ionInput)="onSearchInput($event)"
            (ionClear)="onSearchClear()"
            debounce="300">
          </ion-searchbar>
        </div>
        
        <!-- Componentes do lado direito -->
        <div class="right-components">
          <div class="button-group">
            <ion-button class="header-button" (click)="openNotificationModal()">
              <ion-icon aria-hidden="true" src="../assets/icon/Bell.svg"></ion-icon>
              <ion-badge *ngIf="unreadNotificationsCount > 0" color="danger">
                {{ unreadNotificationsCount }}
              </ion-badge>
            </ion-button>
          </div>
          
          <div class="welcome-text">
            Boas-vindas! <strong>{{ usuario?.nome ? (getPrimeiroNome(usuario.nome) | titlecase) : 'Usuário' }}</strong>
          </div>

          <!-- Avatar do Usuário -->
          <ion-chip color="light" id="profile-chip" (click)="openPopover($event)">
            <ion-avatar>
              <img [src]="fotoPerfil || 'https://ionicframework.com/docs/img/demos/avatar.svg'" alt="Foto de perfil" />
            </ion-avatar>
          </ion-chip>
        </div>

        <!-- Popover de Opções de Perfil -->
        <ion-popover
          [isOpen]="isProfileMenuOpen"
          trigger="profile-chip"
          side="bottom"
          alignment="center"
          (ionPopoverDidDismiss)="isProfileMenuOpen = false"
          class="profile-popover"
        >
          <ng-template>
            <ion-list>
              <ion-item button (click)="openProfileOptionsModal()">
                <ion-icon slot="start" aria-hidden="true" src="../assets/icon/PersonOutline.svg"></ion-icon>
                Opções de Perfil
              </ion-item>

              <!-- Novo item agrupando as opções de Foto de Perfil -->
              <ion-item button (click)="toggleFotoPerfilOptions()">
                <ion-icon slot="start" aria-hidden="true" src="../assets/icon/CameraOutline.svg"></ion-icon>
                Foto de Perfil
                <ion-icon slot="end" aria-hidden="true" src="../assets/icon/ChevronDownOutline.svg"></ion-icon>
              </ion-item>

              <!-- Lista Oculta de Opções -->
              <ion-list *ngIf="fotoPerfilMenuOpen">
                <ion-item button (click)="openFilePicker()">
                  <ion-icon slot="start" aria-hidden="true" src="../assets/icon/ImageOutline.svg"></ion-icon>
                  Editar Foto de Perfil
                </ion-item>
                <ion-item button (click)="confirmRemoveProfilePhoto()">
                  <ion-icon slot="start" aria-hidden="true" src="../assets/icon/Trash.svg"></ion-icon>
                  Remover Foto de Perfil
                </ion-item>
              </ion-list>

              <ion-item button (click)="logout()">
                <ion-icon slot="start" aria-hidden="true" src="../assets/icon/LogOutOutline.svg"></ion-icon>
                Encerrar Sessão
              </ion-item>
            </ion-list>
          </ng-template>
        </ion-popover>

        <input type="file" #fileInput accept="image/png, image/jpeg" (change)="onFileSelected($event)" hidden>
      </div>
    </div>
  </ion-toolbar>
</ion-header>
