<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="voltarParaMeuPerfil()">
        <ion-icon name="arrow-back"></ion-icon>
        Voltar
      </ion-button>
    </ion-buttons>
    <ion-title>Meu perfil > Histórico de pedidos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" *ngIf="pedidos; else loading">
  <ion-segment [(ngModel)]="statusSelecionado" (ionChange)="onStatusChange()">
    <ion-segment-button value="Todos">Todos</ion-segment-button>
    <ion-segment-button value="Pendente">Pendente</ion-segment-button>
    <ion-segment-button value="Enviado">Enviado</ion-segment-button>
    <ion-segment-button value="Entregue">Entregue</ion-segment-button>
    <ion-segment-button value="Cancelado">Cancelado</ion-segment-button>
  </ion-segment>


  <div *ngIf="loading && pedidos.length === 0"  class="not-found">
      Nenhum pedido encontrado.
      Você ainda não realizou nenhuma compra.
  </div>

</ion-content>


<ng-template #loading>
  <div class="loading-container">
    <div class="loading-spinner"></div>
  </div>
</ng-template>
