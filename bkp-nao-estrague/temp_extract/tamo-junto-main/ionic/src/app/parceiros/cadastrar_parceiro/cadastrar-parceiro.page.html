<ion-header>
  <ion-toolbar >
    <ion-title>Novo Parceiro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Card: Dados do Parceiro -->
  
    <ion-card-content >
      <ion-item  style="--background: transparent; --highlight-color-focused: transparent; --highlight-color: transparent; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">
        <ion-label position="floating">Nome do Parceiro</ion-label>
        <ion-input [(ngModel)]="Parceiro.nome" style="margin-top: 12px;" placeholder="Digite o nome"></ion-input>
      </ion-item>

      <ion-item style="--background: transparent; --highlight-color-focused: transparent; --highlight-color: transparent; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">
        <ion-label position="floating">Website</ion-label>
        <ion-input [(ngModel)]="Parceiro.website"  style="margin-top: 12px;"placeholder="https://"></ion-input>
      </ion-item>

      <ion-item style="--background: transparent; --highlight-color-focused: transparent; --highlight-color: transparent; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">
        <ion-label position="floating">Contato</ion-label>
        <ion-input [(ngModel)]="Parceiro.contato"  style="margin-top: 12px;" placeholder="(00) 00000-0000"></ion-input>
      </ion-item>

      <ion-item style="--background: transparent; --highlight-color-focused: transparent; --highlight-color: transparent; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">
        <ion-label>Status</ion-label>
        <ion-toggle slot="end" [(ngModel)]="Parceiro.status" color="success"></ion-toggle>
      </ion-item>
    </ion-card-content>
 

  <!-- Card: Dados da Empresa -->
    <ion-card-content>
      <ion-item style="--background: transparent; --highlight-color-focused: transparent; --highlight-color: transparent; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">
        <ion-label position="floating">Nome da Empresa</ion-label>
        <ion-input [(ngModel)]="Empresa.nome" style="margin-top: 12px;" placeholder="Digite o nome da empresa"></ion-input>
      </ion-item>

      <ion-item style="--background: transparent; --highlight-color-focused: transparent; --highlight-color: transparent; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px;">
        <ion-label position="floating">CNPJ</ion-label>
        <ion-input [(ngModel)]="Empresa.cnpj"  style="margin-top: 12px;" placeholder="00.000.000/0000-00"></ion-input>
      </ion-item>
    </ion-card-content>

  <!-- Botão de ação -->
  <ion-button expand="block" color="primary" (click)="salvar()">
    <ion-icon name="save-outline" slot="start"></ion-icon>
    Salvar
  </ion-button>
</ion-content>
